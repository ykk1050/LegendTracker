name: 매시간 수집 및 게시
# 수집 결과는 data/db.json, 게시 대상은 web/

on:
  schedule:
    # GitHub 예약 실행은 붐비면 자주 빠진다(실제로 몇 시간씩 빠짐).
    # 20분마다 깨우고, 직전 수집이 45분 안이면 collect.py 가 건너뛰어 실제 수집은 대략 1시간에 1번.
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "collect.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 수집
        env:
          PYTHONIOENCODING: utf-8
          MIN_GAP_MINUTES: ${{ github.event_name == 'schedule' && '45' || '' }}
        run: python collect.py
      - name: 자료 저장
        id: save
        run: |
          git config user.name "legend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db.json web/data.js
          if git diff --cached --quiet; then
            echo "변경 없음"
            # 예약 실행에서 바뀐 게 없으면 게시도 건너뛴다. 직접 실행·코드 수정 때는 게시.
            if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
