name: 매시간 수집 및 게시

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "collect.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 수집
        env:
          PYTHONIOENCODING: utf-8
        run: python collect.py
      - name: 자료 저장
        run: |
          git config user.name "legend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db.json web/data.js
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
