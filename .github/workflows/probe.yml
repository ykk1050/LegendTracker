name: probe
on: { push: { branches: [probe], paths: ["probe/**", ".github/workflows/probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f out; git commit -qm "probe out"; git push
